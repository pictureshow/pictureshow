import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
import org.gradle.api.artifacts.Dependency
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.tasks.OutputDirectory
import java.util.zip.ZipInputStream

// A typed output lets AGP carry the asset producer into every variant's build.
abstract class GenerateLicenseCatalog extends DefaultTask {
    @OutputDirectory abstract DirectoryProperty getAssetDirectory()
}

// No runtime AboutLibraries/phone UI: explicit JSONObject keys and an asset survive
// R8 without reflective model keep rules. Query artifacts only after AGP creates variants.
def metadata = layout.buildDirectory.file('licenses/aboutlibraries.json')
def catalogModule = { id ->
    if (id instanceof ModuleComponentIdentifier) return true
    if (id instanceof ProjectComponentIdentifier && id.projectPath in [':app', ':core', ':ui-shared', ':media3-ffmpeg', ':mpv']) return false
    throw new GradleException("Unmapped runtime dependency $id: publish module metadata or add an explicit license mapping.")
}
def runtimeArtifacts = providers.provider {
    configurations.releaseRuntimeClasspath.incoming.artifactView { componentFilter(catalogModule) }.artifacts
}
def desugarArtifacts = providers.provider {
    configurations.coreLibraryDesugaring.incoming.artifactView { componentFilter(catalogModule) }.artifacts
}
def nativeLicense = rootProject.file('third_party/ffmpeg/COPYING.LGPLv2.1')
def extensionLicense = rootProject.file('media3-ffmpeg/LICENSE')
def kotlinNotice = rootProject.file('third_party/kotlin/NOTICE')
def mpvLicenses = rootProject.file('third_party/mpv')
def desugarNotices = rootProject.file('third_party/desugar')
// Billing's published POM identifies ASDKL, but AboutLibraries has no full text.
def androidSdkLicense = rootProject.file('third_party/android-sdk/LICENSE')

def embedded
embedded = { byte[] bytes, String prefix = '' ->
    def result = []
    new ZipInputStream(new ByteArrayInputStream(bytes)).withCloseable { zip ->
        def entry
        while ((entry = zip.nextEntry) != null) {
            def path = entry.name
            def base = path.tokenize('/').last().toUpperCase(Locale.ROOT)
            if (!entry.directory && ['NOTICE', 'LICENSE', 'COPYING'].any { base.startsWith(it) }) {
                result.add("$prefix$path\n\n" + new String(zip.readAllBytes(), 'UTF-8').trim())
            } else if (!entry.directory && path.endsWith('.jar')) {
                result.addAll(embedded(zip.readAllBytes(), "$prefix$path!/"))
            }
        }
    }
    result
}

// AboutLibraries 15.3.0 reads each library's POM, and each parent POM, through a lenient detached configuration
// (BaseAboutLibrariesTask.fetchPomBatch). A POM the repository fails to serve is skipped without a word: the library
// drops out of aboutlibraries.json and the catalog stops with "Missing license metadata" for a library that declares
// a license (desktop/licenses.gradle has the same pre-fetch). On GitHub's runners Maven Central answered 404 for every
// POM one job in eight asked for (2026-11-19).
// So the same POMs are fetched strictly first: a repository fault fails here and names the file, and the export,
// which resolves its POMs again when it runs, reads them from the cache.
def pomCoordinates = providers.provider {
    [configurations.releaseRuntimeClasspath, configurations.coreLibraryDesugaring].collectMany {
        it.incoming.resolutionResult.allComponents.collect { it.id }.findAll { it instanceof ModuleComponentIdentifier }
            .collect { "${it.group}:${it.module}:${it.version}".toString() }
    }.unique()
}
def pomDependencies = dependencies
def pomConfigurations = configurations
def resolveLicensePoms = tasks.register('resolveLicensePoms') {
    doLast {
        def requested = [] as Set
        def level = pomCoordinates.get() as LinkedHashSet
        while (level) {
            def parents = [] as LinkedHashSet
            // One version of a module per detached configuration, so conflict resolution can't drop a version. An array, not
            // a spread: a JVM call takes at most 255 arguments and the app has more POMs than that.
            def versions = level.groupBy { it.substring(0, it.lastIndexOf(':')) }.values()
            (0..<versions*.size().max()).each { slot ->
                def batch = versions.findAll { it.size() > slot }.collect { it[slot] }
                requested.addAll(batch)
                def poms = pomConfigurations.detachedConfiguration(batch.collect { pomDependencies.create("$it@pom") } as Dependency[])
                poms.transitive = false
                def files
                try {
                    files = poms.incoming.artifactView {}.artifacts.artifacts.collect { it.file }
                } catch (Exception e) {
                    // Gradle would report only its resolution error (the deepest contextual one), so its text goes in this message.
                    def reasons = [e.message] + (e.respondsTo('getCauses') ? e.causes : [e.cause]).findAll()*.message
                    throw new GradleException('A repository did not serve a POM the license catalog reads (AboutLibraries would drop that library ' +
                        'without an error). Re-run once the repository answers; do not add a license override for it.\n' + reasons.unique().join('\n'))
                }
                files.each { pom ->
                    def parent = new XmlSlurper(false, false).parse(pom).parent
                    def coordinate = [parent.groupId.text(), parent.artifactId.text(), parent.version.text()]
                    if (coordinate.every { it && !it.contains('$') }) parents.add(coordinate.join(':'))
                }
            }
            level = parents - requested
        }
        logger.lifecycle("License POMs: ${requested.size()} resolved")
    }
}
tasks.named('exportLibraryDefinitions') { dependsOn(resolveLicensePoms) }

def generateLicenseCatalog = tasks.register('generateLicenseCatalog', GenerateLicenseCatalog) {
    dependsOn('exportLibraryDefinitions')
    assetDirectory.set(layout.buildDirectory.dir('generated/licenseAssets'))
    inputs.file(file('licenses.gradle'))
    inputs.file(metadata)
    inputs.files(runtimeArtifacts.map { it.artifactFiles }, desugarArtifacts.map { it.artifactFiles })
    inputs.files(nativeLicense, extensionLicense, kotlinNotice)
    inputs.dir(desugarNotices)
    inputs.dir(mpvLicenses)
    inputs.file(androidSdkLicense)
    doLast {
        def data = new JsonSlurper().parse(metadata.get().asFile)
        def artifacts = (runtimeArtifacts.get().artifacts + desugarArtifacts.get().artifacts).findAll {
            !it.id.componentIdentifier.module.startsWith('desugar_jdk_libs_configuration')
        }
        def rows = artifacts.collect { artifact ->
            def module = artifact.id.componentIdentifier
            def id = "${module.group}:${module.module}".toString()
            def definitions = data.libraries.findAll { it.uniqueId == id }
            def isDesugar = id == 'com.android.tools:desugar_jdk_libs'
            if (isDesugar && module.version != '2.1.5') {
                throw new GradleException("Update third_party/desugar notices for ${module.version}")
            }
            if (definitions.size() != 1 && !isDesugar) {
                throw new GradleException("Missing license metadata for $id:${module.version}")
            }
            def definition = definitions ? definitions.first() : null
            def licenseDefinitions = (definition?.licenses ?: []).collect { hash ->
                def license = data.licenses[hash]
                if (!license) throw new GradleException("Missing license $hash for $id")
                license
            }
            def notices = embedded(artifact.file.bytes)
            if (id == 'org.jetbrains.kotlin:kotlin-stdlib') notices.add(kotlinNotice.getText('UTF-8'))
            if (isDesugar) {
                notices.addAll(['LICENSE', 'ASSEMBLY_EXCEPTION', 'ADDITIONAL_LICENSE_INFO'].collect {
                    new File(desugarNotices, it).getText('UTF-8')
                })
                notices.add(extensionLicense.getText('UTF-8'))
            }
            notices = notices.unique().sort()
            def identifiers = licenseDefinitions.collect { it.spdxId ?: it.name }
            def texts = licenseDefinitions.collect {
                it.spdxId == 'ASDKL' ? androidSdkLicense.getText('UTF-8') : (it.content ?: '')
            }
            if (!isDesugar && (!identifiers || !texts.every { it.length() > 500 })) {
                throw new GradleException("Missing full license for $id: $identifiers. Add a verified upstream override; do not ship an unknown license.")
            }
            def source = isDesugar ? ['Source: https://github.com/google/desugar_jdk_libs/tree/73170c345e6a762fc6a1f0301bb15218850023ef'] : []
            [id: id, name: definition?.name ?: module.module, version: module.version,
             license: isDesugar ? 'GPL-2.0-only WITH Classpath-exception-2.0 AND Apache-2.0' : identifiers.join(' / '),
             text: (texts + notices + source).join('\n\n'), notices: notices]
        }.unique { it.id }
        rows.add([
            id: 'ffmpeg', name: 'FFmpeg', version: '6.0.1', license: 'LGPL-2.1-or-later', notices: [],
            text: '''FFmpeg 6.0.1 — Copyright the FFmpeg developers.
Licensed under the GNU Lesser General Public License 2.1 or later.
libavcodec, libavutil and libswresample are shared libraries, dynamically linked by the Media3 JNI wrapper.
Unmodified source: https://ffmpeg.org/releases/ffmpeg-6.0.1.tar.xz
Source, checksum, configure lines and replacement instructions:
https://github.com/pictureshow/pictureshow/blob/main/third_party/ffmpeg/README.md
Our build configuration:
https://github.com/pictureshow/pictureshow/blob/main/tools/ffmpeg/build.sh

''' + nativeLicense.getText('UTF-8')
        ])
        rows.add([
            id: 'media3-ffmpeg', name: 'Media3 FFmpeg decoder extension and JNI wrapper', version: '1.11.1',
            license: 'Apache-2.0', notices: [],
            text: 'Copyright The Android Open Source Project.\n' +
                'Source: https://github.com/androidx/media/tree/1.11.1/libraries/decoder_ffmpeg\n\n' + extensionLicense.getText('UTF-8')
        ])
        // PLAY-60: the libmpv closure in mpv/src/main/jniLibs (third_party/mpv/README.md lists sources and checksums).
        def mpvSource = '\nSource, checksums and build: https://github.com/pictureshow/pictureshow/blob/main/third_party/mpv/README.md\n\n'
        def lgpl = new File(mpvLicenses, 'COPYING.LGPLv2.1').getText('UTF-8')
        [
            [id: 'mpv', name: 'mpv (libmpv)', version: '0.42.0', license: 'LGPL-2.1-or-later',
             text: 'mpv, built with -Dgpl=false. Copyright the mpv developers.\n' +
                 'libmpv.so is a shared library; replace it with your own build as third_party/mpv/README.md describes.' +
                 mpvSource + new File(mpvLicenses, 'mpv.Copyright').getText('UTF-8') + '\n\n' + lgpl],
            [id: 'ffmpeg-mpv', name: 'FFmpeg (for mpv)', version: '8.1.3', license: 'LGPL-2.1-or-later',
             text: 'FFmpeg 8.1.3, built without --enable-gpl, --enable-version3 or --enable-nonfree. Copyright the FFmpeg developers.\n' +
                 'Shared libraries with the _mpv suffix, dynamically linked by libmpv.so.' + mpvSource + lgpl],
            [id: 'libplacebo', name: 'libplacebo', version: '7.387.0', license: 'LGPL-2.1-or-later',
             text: 'Copyright the libplacebo developers.' + mpvSource + lgpl],
            [id: 'fribidi', name: 'GNU FriBidi', version: '1.0.18', license: 'LGPL-2.1-or-later',
             text: 'Copyright the FriBidi authors.' + mpvSource + lgpl],
            [id: 'libass', name: 'libass', version: '0.17.5', license: 'ISC',
             text: new File(mpvLicenses, 'libass.COPYING').getText('UTF-8')],
            [id: 'dav1d', name: 'dav1d', version: '1.5.4', license: 'BSD-2-Clause',
             text: new File(mpvLicenses, 'dav1d.COPYING').getText('UTF-8')],
            [id: 'freetype', name: 'FreeType', version: '2.15.0', license: 'FTL',
             text: 'Portions of this software are copyright © The FreeType Project (www.freetype.org). All rights reserved.\n\n' +
                 new File(mpvLicenses, 'freetype.FTL.TXT').getText('UTF-8')],
            [id: 'harfbuzz', name: 'HarfBuzz', version: '15.1.0', license: 'MIT-Modern-Variant',
             text: new File(mpvLicenses, 'harfbuzz.COPYING').getText('UTF-8')],
            [id: 'fontconfig', name: 'Fontconfig', version: '2.18.3', license: 'HPND-sell-variant',
             text: new File(mpvLicenses, 'fontconfig.COPYING').getText('UTF-8')],
            [id: 'expat', name: 'Expat', version: '2.10.0', license: 'MIT',
             text: new File(mpvLicenses, 'expat.COPYING').getText('UTF-8')],
            [id: 'fast_float', name: 'fast_float (in libplacebo)', version: 'libplacebo 7.387.0', license: 'MIT',
             text: new File(mpvLicenses, 'fast_float.LICENSE-MIT').getText('UTF-8')],
            [id: 'glad', name: 'glad OpenGL loader (in libplacebo)', version: 'libplacebo 7.387.0', license: 'MIT',
             text: new File(mpvLicenses, 'glad.LICENSE').getText('UTF-8')],
            [id: 'libcxx-ndk', name: 'LLVM libc++ (Android NDK r26b, in libmpv)', version: '26.1.10909125',
             license: 'Apache-2.0 WITH LLVM-exception', text: new File(mpvLicenses, 'libcxx.LICENSE.TXT').getText('UTF-8')]
        ].each { row -> rows.add(row + [notices: []]) }
        def target = assetDirectory.file('licenses/catalog.json').get().asFile
        target.parentFile.mkdirs()
        target.setText(JsonOutput.toJson([libraries: rows.sort { a, b ->
            a.name.toLowerCase(Locale.ROOT) <=> b.name.toLowerCase(Locale.ROOT) ?: a.id <=> b.id
        }]), 'UTF-8')
        logger.lifecycle("License catalog: ${rows.size()} libraries; no unknown licenses")
    }
}
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.sources.assets?.addGeneratedSourceDirectory(generateLicenseCatalog) { it.assetDirectory }
}
// Keep the shared directory's producer explicit for asset merges across all variants.
tasks.matching { it.name ==~ /merge.*Assets/ }.configureEach { dependsOn(generateLicenseCatalog) }
