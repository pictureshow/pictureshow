name: Pictureshow
options:
  bundleIdPrefix: app.pictureshow
  deploymentTarget:
    iOS: '17.0'
    tvOS: '17.0'
packages:
  PictureshowCore:
    path: PictureshowCore
  PictureshowTransport:
    path: PictureshowTransport
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: app.pictureshow
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Pictureshow
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Pictureshow connects to the Jellyfin server you choose.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
targets:
  Pictureshow-iOS:
    type: application
    platform: iOS
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: app.pictureshow.playback
            CFBundleURLSchemes: [pictureshow]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    sources: [App]
    dependencies:
      - package: PictureshowCore
      - package: PictureshowTransport
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  Pictureshow-tvOS:
    type: application
    platform: tvOS
    info:
      path: Config/tvOS-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: app.pictureshow.playback
            CFBundleURLSchemes: [pictureshow]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    sources: [App]
    dependencies:
      - package: PictureshowCore
      - package: PictureshowTransport
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '3'
  Pictureshow-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Pictureshow-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pictureshow.uitests
        TEST_TARGET_NAME: Pictureshow-iOS
  Pictureshow-tvOS-UITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [UITests]
    dependencies:
      - target: Pictureshow-tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pictureshow.uitests
        TEST_TARGET_NAME: Pictureshow-tvOS
schemes:
  Pictureshow-iOS:
    build:
      targets:
        Pictureshow-iOS: all
    test:
      targets: [Pictureshow-iOS-UITests]
  Pictureshow-tvOS:
    build:
      targets:
        Pictureshow-tvOS: all
    test:
      targets: [Pictureshow-tvOS-UITests]
