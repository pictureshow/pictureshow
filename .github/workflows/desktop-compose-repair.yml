name: Compose native layer repair
on:
  push:
    branches: ["ci/128-*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-compose-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Core vectors on desktop and native runtime
        run: ./gradlew.bat --no-daemon :desktop:test :desktop:spikeRuntime
      - name: LGPL libmpv and generated CC0 media
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/mpv-player/mpv/releases/download/v0.42.0/libmpv-v0.42.0-x86_64-w64-mingw32-lgpl.zip -OutFile mpv.zip
          if ((Get-FileHash mpv.zip -Algorithm SHA256).Hash.ToLower() -ne '8e5f77430efc53ef175804ba6618527e3af0448a0dcabf04d3cc72659d1a6fce') { throw 'libmpv digest mismatch' }
          Expand-Archive mpv.zip native
          choco install ffmpeg --no-progress -y
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          python desktop/tools/fixtures.py desktop-fixtures
          python desktop/tools/performance_fixture.py desktop-fixtures
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Mark the public header as a consumer import
        shell: pwsh
        run: |
          $header = 'native/include/mpv/client.h'
          (Get-Content $header -Raw).Replace('__declspec(dllexport)', '__declspec(dllimport)') | Set-Content $header
      - name: Build D3D11 adapter against the public libmpv headers
        shell: cmd
        run: cl /nologo /EHsc /LD /std:c++17 /I native/include desktop/src/native/windows_layer.cpp /link d3d11.lib dxgi.lib user32.lib /OUT:desktop/build/pictureshow-layer.dll
      - name: Exercise FP16 scRGB and transparent Compose controls
        shell: pwsh
        run: |
          $dll = Get-ChildItem native -Recurse -Filter '*mpv*.dll' | Select-Object -First 1
          $env:MPV_LIBRARY = $dll.FullName
          $env:PATH = "$($dll.DirectoryName);$env:PATH"
          $env:SPIKE_NULL_AUDIO = '1'
          $env:SPIKE_SOFTWARE_GPU = '1'
          $env:SPIKE_LAYER_BRIDGE = (Resolve-Path desktop/build/pictureshow-layer.dll).Path
          $env:SKIKO_RENDER_API = 'SOFTWARE'
          $failed = $false
          foreach ($media in @('hevc-main', 'hevc-main10', 'av1', 'hevc-pq-metadata', 'hevc-main10-1080p60')) {
            $extra = @()
            if ($media -eq 'hevc-main10-1080p60') { $extra = @('--sustain=125') }
            java --enable-native-access=ALL-UNNAMED -cp 'desktop/build/spike-runtime/lib/*' app.pictureshow.desktop.MainKt layer "desktop-fixtures/$media.mkv" "desktop-evidence/windows-layer-$media" @extra
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'Native layer probe failed; inspect retained evidence' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-compose-repair
          retention-days: 7
          path: |
            desktop-evidence/**
            desktop/build/test-results/**
            desktop/build/reports/tests/**
            desktop-fixtures/*LICENSE.json
