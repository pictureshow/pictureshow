name: Windows and Linux desktop packages
on:
  push:
    branches: ["main", "ci/**"]
    paths:
      - ".github/workflows/desktop-packages.yml"
      - "desktop/**"
      - "ui-shared/**"
      - "core/**"
      - "app/src/main/res/mipmap-*/ic_launcher.png"
      - "gradle/**"
      - "**/*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
permissions:
  contents: read
concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.repository == 'pictureshow/pictureshow'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            make unzip curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Assemble MSI and Store MSIX
        id: windows-assembly
        shell: msys2 {0}
        run: bash desktop/tools/package-windows.sh
      - name: Certify the signed test copy and smoke both installed launchers
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          ./desktop/tools/windows/test-packages.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pictureshow-windows-package-evidence
          retention-days: 3
          if-no-files-found: ignore
          path: |
            desktop/build/windows-package/evidence/**
            desktop/build/windows-package/work-*/native/ffmpeg-build.log
            desktop/build/windows-package/work-*/native/*-build/meson-logs/meson-log.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.windows-assembly.outcome == 'success'
        with:
          name: pictureshow-windows-unsigned-x64
          retention-days: 3
          if-no-files-found: error
          path: |
            desktop/build/windows-package/*.msi
            desktop/build/windows-package/*.msix
            desktop/build/windows-package/temurin-sources.tar.gz
            desktop/build/windows-package/SHA256SUMS

  linux:
    if: github.repository == 'pictureshow/pictureshow'
    # Keep packaged glibc and libstdc++ requirements within the Flatpak SDK
    # baseline even as ubuntu-latest advances. Smoke still uses ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Install the Linux build and smoke tools
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=35 -o Acquire::https::Timeout=35 update
          sudo apt-get install -y --no-install-recommends build-essential meson ninja-build pkgconf curl xz-utils automake \
            libfontconfig1-dev libasound2-dev libpulse-dev libgnutls28-dev libgl-dev libegl-dev libwayland-dev \
            nasm python3 patchelf desktop-file-utils appstream imagemagick flatpak flatpak-builder
      - name: Assemble the AppImage and Flatpak build input
        run: bash desktop/tools/package-linux.sh
      - name: Build and validate the Flatpak from the same payload
        shell: bash
        run: |
          output="$PWD/desktop/build/linux-package"
          app_id=app.pictureshow.Pictureshow
          desktop-file-validate "$output/flatpak/payload/share/applications/$app_id.desktop"
          report="$output/evidence/appstream-validation.txt"
          validation=0
          LC_ALL=C appstreamcli validate --no-net --no-color \
            "$output/flatpak/payload/share/metainfo/$app_id.metainfo.xml" > "$report" 2>&1 || validation=$?
          cat "$report"
          if (( validation != 0 )); then
            # Keep the approved source URL in the description. Any other issue remains fatal.
            mapfile -t issues < <(grep -E '^[EW]:' "$report")
            expected='^W: app\.pictureshow\.Pictureshow:[0-9]+: description-has-plaintext-url p$'
            if [[ $validation != 3 || ${#issues[@]} != 1 || ! ${issues[0]:-} =~ $expected ]]; then
              exit "$validation"
            fi
            echo "Accepted the plaintext source URL warning for the approved description."
          fi
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Sdk//25.08 org.freedesktop.Platform//25.08
          flatpak-builder --user --disable-download --repo="$output/flatpak-repo" "$output/flatpak-build" "$output/flatpak/$app_id.yml"
          flatpak-builder --run "$output/flatpak-build" "$output/flatpak/$app_id.yml" sh -eu -c '
            ldd /app/lib/pictureshow/lib/pictureshow/libpictureshow_wayland.so
            ldd /app/lib/pictureshow/lib/pictureshow/libmpv.so.2
          ' | tee "$output/evidence/flatpak-runtime-libraries.txt"
          if grep -F 'not found' "$output/evidence/flatpak-runtime-libraries.txt"; then exit 1; fi
          flatpak build-bundle "$output/flatpak-repo" "$output/Pictureshow-x86_64.flatpak" "$app_id"
          cd "$output"
          sha256sum Pictureshow-x86_64.flatpak >> SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pictureshow-linux-package-evidence
          retention-days: 3
          if-no-files-found: ignore
          path: |
            desktop/build/linux-package/evidence/**
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pictureshow-linux-unsigned-x86_64
          retention-days: 3
          if-no-files-found: error
          path: |
            desktop/build/linux-package/*.AppImage
            desktop/build/linux-package/*.flatpak
            desktop/build/linux-package/temurin-sources.tar.gz
            desktop/build/linux-package/SHA256SUMS


  linux-smoke:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pictureshow-linux-unsigned-x86_64
          path: desktop/build/linux-package
      - name: Install the compositor and fixture tools
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=35 -o Acquire::https::Timeout=35 update
          sudo apt-get install -y --no-install-recommends build-essential meson ninja-build pkgconf curl xz-utils \
            libgl-dev libegl-dev libgles2-mesa-dev libgbm-dev libudev-dev libwayland-dev \
            libdrm-dev libinput-dev libevdev-dev libxkbcommon-dev libpixman-1-dev liblcms2-dev \
            libcairo2-dev libpango1.0-dev libjpeg-dev libwebp-dev libpng-dev hwdata \
            edid-decode ffmpeg libgl1-mesa-dri libfontconfig1 libasound2t64 libpulse0 libgnutls30t64 xvfb xauth
      - name: Smoke the AppImage on Xvfb and the owned Wayland compositor
        run: |
          chmod +x desktop/build/linux-package/Pictureshow-1.0-x86_64.AppImage
          PICTURESHOW_WESTON_ONLY=1 bash desktop/tools/hdr/linux_build.sh
          PICTURESHOW_WESTON_PREFIX="$PWD/desktop/build/hdr-linux/prefix" \
            APPIMAGE_EXTRACT_AND_RUN=1 PICTURESHOW_SMOKE_FORCE_QUALITY=1 \
            bash desktop/tools/app-smoke/linux-run.sh \
              --launcher desktop/build/linux-package/Pictureshow-1.0-x86_64.AppImage \
              --work desktop/build/disposable-appimage-smoke --evidence desktop-evidence/appimage-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pictureshow-linux-smoke-evidence
          retention-days: 3
          if-no-files-found: ignore
          path: desktop-evidence/**
