name: Desktop numeric HDR Linux
on:
  # Full compositor capture is reserved for renderer/HDR changes; dispatch remains available.
  push:
    branches: ["main", "ci/**"]
    paths:
      - "desktop/src/native/**"
      - "desktop/src/main/kotlin/app/pictureshow/desktop/**"
      - "desktop/tools/hdr/**"
      - "desktop/build.gradle.kts"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/desktop-hdr-linux.yml"
  pull_request:
    paths:
      - "desktop/src/native/**"
      - "desktop/src/main/kotlin/app/pictureshow/desktop/**"
      - "desktop/tools/hdr/**"
      - "desktop/build.gradle.kts"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/desktop-hdr-linux.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-hdr-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Numeric contract and negative controls
        run: python3 -m unittest discover -s desktop/tools/hdr -p test_analyze.py -v
      - name: Build prerequisites (runner only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential meson ninja-build pkgconf curl xz-utils libass-dev libplacebo-dev libgl-dev libegl-dev libgles2-mesa-dev libgbm-dev libudev-dev libwayland-dev wayland-protocols libdrm-dev libinput-dev libevdev-dev libxkbcommon-dev libpixman-1-dev liblcms2-dev libcairo2-dev libpango1.0-dev libjpeg-dev libwebp-dev libpng-dev hwdata edid-decode nasm python3 ffmpeg libgl1-mesa-dri libasound2t64
      - name: Build exact LGPL renderer and stock Weston
        run: bash desktop/tools/hdr/linux_build.sh
      - name: Build actual Compose application
        run: ./gradlew --no-daemon :desktop:spikeRuntime
      - name: Generate lossless CC0 known-nit fixtures
        run: python3 desktop/tools/hdr/fixture.py desktop-fixtures/hdr
      - name: Capture app through HDR and SDR compositor outputs
        run: bash desktop/tools/hdr/linux_run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-hdr-numeric
          retention-days: 7
          path: |
            desktop-evidence/hdr-linux/**
            desktop-fixtures/hdr/manifest.json
            desktop/build/hdr-linux/*-build/meson-logs/**
