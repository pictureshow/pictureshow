name: Desktop surface spike
on:
  push:
    branches: [desktop-spike]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-spike-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Core vectors on desktop and native runtime
        run: ./gradlew.bat --no-daemon :desktop:test :desktop:spikeRuntime
      - name: LGPL libmpv and generated CC0 media
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/mpv-player/mpv/releases/download/v0.42.0/libmpv-v0.42.0-x86_64-w64-mingw32-lgpl.zip -OutFile mpv.zip
          if ((Get-FileHash mpv.zip -Algorithm SHA256).Hash.ToLower() -ne '8e5f77430efc53ef175804ba6618527e3af0448a0dcabf04d3cc72659d1a6fce') { throw 'libmpv digest mismatch' }
          Expand-Archive mpv.zip native
          choco install ffmpeg --no-progress -y
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          python desktop/tools/fixtures.py desktop-fixtures
      - name: Exercise both surfaces without claiming hardware decode
        shell: pwsh
        run: |
          $dll = Get-ChildItem native -Recurse -Filter '*mpv*.dll' | Select-Object -First 1
          if (!$dll) { throw 'Missing libmpv DLL' }
          $env:MPV_LIBRARY = $dll.FullName
          $env:PATH = "$($dll.DirectoryName);$env:PATH"
          $env:SPIKE_NULL_AUDIO = '1'
          $failed = $false
          foreach ($shape in @('render', 'wid')) {
            java --enable-native-access=ALL-UNNAMED -cp 'desktop/build/spike-runtime/lib/*' app.pictureshow.desktop.MainKt $shape desktop-fixtures/hevc-main10.mkv "desktop-evidence/windows-$shape" --auto
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'One or more surface probes failed; inspect evidence' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-desktop-spike
          retention-days: 7
          path: |
            desktop-evidence/**
            desktop/build/test-results/**
            desktop/build/reports/tests/**
            desktop-fixtures/LICENSE.json
