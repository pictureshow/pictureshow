name: Android device CI

on:
  push:
    paths:
      - app/**
      - core/**
      - media3-ffmpeg/**
      - spec/**
      - build-logic/**
      - gradle/**
      - tools/ffmpeg/**
      - build.gradle.kts
      - gradle.properties
      - gradlew
      - gradlew.bat
      - settings.gradle.kts
      - .github/workflows/ci-android-device.yml
  pull_request:
    paths:
      - app/**
      - core/**
      - media3-ffmpeg/**
      - spec/**
      - build-logic/**
      - gradle/**
      - tools/ffmpeg/**
      - build.gradle.kts
      - gradle.properties
      - gradlew
      - gradlew.bat
      - settings.gradle.kts
      - .github/workflows/ci-android-device.yml

permissions:
  contents: read

concurrency:
  group: android-device-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM access for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::ubuntu-latest did not expose the KVM device"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run Android instrumented audio decoder tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-snapshot
          script: ./gradlew :media3-ffmpeg:connectedDebugAndroidTest

      - name: Collect Android instrumented test counts
        if: always()
        shell: bash
        run: |
          mkdir -p android-device-test-results
          python3 - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for path in pathlib.Path("media3-ffmpeg/build/outputs/androidTest-results").rglob("TEST-*.xml"):
              try:
                  root = ET.parse(path).getroot()
              except (ET.ParseError, OSError):
                  continue
              for key in totals:
                  totals[key] += int(root.get(key, 0))

          pathlib.Path("android-device-test-results/test-counts.json").write_text(json.dumps(totals, indent=2) + "\n")
          print(json.dumps(totals, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-device-test-results
          path: |
            android-device-test-results
            media3-ffmpeg/build/outputs/androidTest-results
            media3-ffmpeg/build/reports/androidTests
          retention-days: 5
          if-no-files-found: ignore
