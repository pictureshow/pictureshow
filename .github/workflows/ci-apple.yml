name: Apple CI

on:
  push:
    paths:
      - apple/**
      - spec/**
      - .github/workflows/ci-apple.yml
  pull_request:
    paths:
      - apple/**
      - spec/**
      - .github/workflows/ci-apple.yml

permissions:
  contents: read

concurrency:
  group: apple-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - id: apple-source
        name: Check whether Apple sources exist on this branch
        run: |
          if [[ -f apple/project.yml ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Apple sources are not present on this branch; skipping Apple checks."
          fi

      - name: Prepare results directory
        if: steps.apple-source.outputs.available == 'true'
        run: mkdir -p apple-test-results

      - name: Install XcodeGen when it is not on the runner image
        if: steps.apple-source.outputs.available == 'true'
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate the Xcode project
        id: project
        if: steps.apple-source.outputs.available == 'true'
        continue-on-error: true
        run: xcodegen generate --spec apple/project.yml

      - name: Select available iOS and tvOS simulators
        id: simulators
        if: steps.apple-source.outputs.available == 'true' && steps.project.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"], text=True
          ))["devices"]
          found = {}
          for runtime, runtime_devices in devices.items():
              for device in runtime_devices:
                  name = device.get("name", "")
                  if not device.get("isAvailable", True):
                      continue
                  if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS") and name.startswith("iPhone"):
                      found.setdefault("ios_udid", device["udid"])
                      version = re.search(r"iOS-(\d+)(?:-|$)", runtime)
                      if version and int(version[1]) >= 27:
                          found.setdefault("voiceover_ios_udid", device["udid"])
                  if runtime.startswith("com.apple.CoreSimulator.SimRuntime.tvOS") and name.startswith("Apple TV"):
                      found.setdefault("tvos_udid", device["udid"])
                      version = re.search(r"tvOS-(\d+)(?:-|$)", runtime)
                      if version and int(version[1]) >= 27:
                          found.setdefault("voiceover_tvos_udid", device["udid"])
          if set(found) != {"ios_udid", "tvos_udid", "voiceover_ios_udid", "voiceover_tvos_udid"}:
              raise SystemExit(f"Native unit tests and actual VoiceOver require available iOS and tvOS simulators, including a 27+ pair: {found}")
          # The 27+ unit pair initializes the same OS image before UI clones
          # are allocated. UI sandboxes remain separate from units and each other.
          found["ios_udid"] = found["voiceover_ios_udid"]
          found["tvos_udid"] = found["voiceover_tvos_udid"]
          records = {d["udid"]: d for group in devices.values() for d in group}
          for base in set(found.values()):
              state = records[base]["state"]
              if state == "Booted":
                  subprocess.run(["xcrun", "simctl", "shutdown", base], check=True)
              elif state != "Shutdown":
                  raise SystemExit(f"Selected simulator is not ready for cloning: {base} {state}")
          lifecycle_source = r'''
          """CI-only lifecycle actions restricted to IDs recorded by this job's selector."""
          from pathlib import Path
          import argparse, datetime, json, os, subprocess
          p = argparse.ArgumentParser()
          p.add_argument("action", choices=["shutdown", "dispose"])
          p.add_argument("scope", choices=["units", "voiceover_ios_udid", "voiceover_tvos_udid", "catalog_ios_udid", "catalog_tvos_udid", "ui"])
          a = p.parse_args()
          receipt = Path("apple-test-results/ui-simulator-lifecycle.json")
          data = json.loads(receipt.read_text())
          assert data["runID"] == os.environ["GITHUB_RUN_ID"]
          if a.scope == "units":
              assert a.action == "shutdown"
              targets = {key: {"udid": value} for key, value in data["unitDevices"].items()}
          elif a.scope == "ui":
              assert a.action == "dispose"
              targets = data["ownedUIClones"]
          else:
              assert a.action == "shutdown"
              targets = {a.scope: data["ownedUIClones"][a.scope]}
          failures = []
          def record(key, target, action, status, **details):
              event = {"utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                       "key": key, "udid": target["udid"], "action": action,
                       "status": status, **details}
              data["events"].append(event)
              receipt.write_text(json.dumps(data, indent=2) + "\n")
              if status == "failed":
                  failures.append(event)
          for key, target in targets.items():
              target_failure_count = len(failures)
              try:
                  devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "--json"], text=True))["devices"]
                  matches = [d for group in devices.values() for d in group if d["udid"] == target["udid"]]
                  if not matches and a.action == "dispose":
                      record(key, target, "verify", "alreadyAbsent")
                      record(key, target, "dispose", "succeeded", alreadyAbsent=True)
                      continue
                  assert len(matches) == 1, (key, matches)
                  device = matches[0]
                  if "name" in target:
                      assert device["name"] == target["name"]
                  assert device["state"] in ["Booted", "Shutdown"], (key, device["state"])
              except Exception as error:
                  record(key, target, "verify", "failed", error=str(error))
                  if a.action == "dispose":
                      record(key, target, "dispose", "failed", error="Ownership/state verification failed; no action taken")
                  continue  # Never act on an ID whose ownership/state was not verified.
              if device["state"] == "Booted":
                  try:
                      subprocess.run(["xcrun", "simctl", "shutdown", target["udid"]], check=True)
                      record(key, target, "shutdown", "succeeded", beforeState=device["state"])
                  except Exception as error:
                      record(key, target, "shutdown", "failed", beforeState=device["state"], error=str(error))
              else:
                  record(key, target, "shutdown", "alreadyShutdown", beforeState=device["state"])
              if a.action == "dispose":
                  try:
                      subprocess.run(["xcrun", "simctl", "delete", target["udid"]], check=True)
                      record(key, target, "delete", "succeeded")
                  except Exception as error:
                      record(key, target, "delete", "failed", error=str(error))
                  if len(failures) == target_failure_count:
                      record(key, target, "dispose", "succeeded")
                  else:
                      record(key, target, "dispose", "failed", error="One or more recorded shutdown/delete actions failed")
          if failures:
              raise SystemExit(f"{len(failures)} owned simulator lifecycle actions failed; all recorded targets were attempted; see {receipt}")
          '''
          (Path(os.environ["RUNNER_TEMP"]) / "leg132-ui-simulator-lifecycle.py").write_text(lifecycle_source)
          ui_sources = {
              "voiceover_ios_udid": found["voiceover_ios_udid"],
              "voiceover_tvos_udid": found["voiceover_tvos_udid"],
              "catalog_ios_udid": found["ios_udid"],
              "catalog_tvos_udid": found["tvos_udid"],
          }
          receipt = Path("apple-test-results/ui-simulator-lifecycle.json")
          receipt.parent.mkdir(parents=True, exist_ok=True)
          data = {"runID": os.environ["GITHUB_RUN_ID"],
                  "unitDevices": {key: found[key] for key in ["ios_udid", "tvos_udid"]},
                  "uiSources": ui_sources,
                  "ownedUIClones": {}, "events": []}
          def persist():
              receipt.write_text(json.dumps(data, indent=2) + "\n")
          persist()  # Record the empty ownership set before creating any clone.
          allocation_source = r'''
          from pathlib import Path
          import datetime, json, os, subprocess
          receipt = Path("apple-test-results/ui-simulator-lifecycle.json")
          data = json.loads(receipt.read_text())
          assert data["runID"] == os.environ["GITHUB_RUN_ID"]
          assert not data["ownedUIClones"], "Allocate this job's UI clones only once"
          ui_sources = data["uiSources"]
          units = set(data["unitDevices"].values())
          assert set(ui_sources.values()) == units
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "--json"], text=True))["devices"]
          records = {d["udid"]: d for group in devices.values() for d in group}
          # The guarded workflow step runs only after both unit results succeed
          # and the dedicated lifecycle step shuts their exact devices down.
          for base in units:
              assert records[base]["state"] == "Shutdown", (base, records[base]["state"])
          data["allocationPhase"] = "after-passed-27-unit-tests-and-unit-shutdown"
          data["warmSourceObservations"] = {
              base: {"state": records[base]["state"], "dataPathSize": records[base].get("dataPathSize")}
              for base in sorted(units)
          }
          def persist():
              receipt.write_text(json.dumps(data, indent=2) + "\n")
          persist()
          def inventory():
              groups = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "--json"], text=True))["devices"]
              return {d["udid"]: {**d, "runtime": runtime} for runtime, group in groups.items() for d in group}
          def reconcile(key, base, name, before, returned=None):
              after = inventory()
              source = before[base]
              matches = [d for uid, d in after.items() if uid not in before
                         and d["name"] == name and d["runtime"] == source["runtime"]
                         and d.get("deviceTypeIdentifier") == source.get("deviceTypeIdentifier")]
              assert len(matches) == 1, (name, "Cannot establish unique new clone ownership", matches)
              clone = matches[0]["udid"]
              assert clone not in units
              assert clone not in {d["udid"] for d in data["ownedUIClones"].values()}
              data["ownedUIClones"][key] = {"udid": clone, "name": name, "base": base}
              persist()
              assert returned is None or returned == clone, "Clone output differs from verified inventory"
          try:
              for key, base in ui_sources.items():
                  name = f"Leg132-{os.environ['GITHUB_RUN_ID']}-{key}"
                  before = inventory()
                  assert not any(d["name"] == name for d in before.values()), (name, "Run-specific name already exists")
                  try:
                      clone = subprocess.check_output(["xcrun", "simctl", "clone", base, name], text=True).strip()
                  except BaseException:
                      try:
                          reconcile(key, base, name, before)
                      except Exception as ownership_error:
                          data.setdefault("ownershipReconciliationErrors", []).append({"key": key, "name": name, "error": str(ownership_error)})
                          persist()  # Ambiguous/unknown IDs are retained for diagnosis, never deleted.
                      raise
                  reconcile(key, base, name, before, returned=clone)
          except BaseException as creation_error:
              data["creationError"] = str(creation_error)
              persist()
              # The helper attempts and records EVERY verified owned clone, even
              # after an earlier deletion fails. Preserve the original exception.
              try:
                  subprocess.run(["python3", str(Path(os.environ["RUNNER_TEMP"]) / "leg132-ui-simulator-lifecycle.py"),
                                  "dispose", "ui"], check=True)
              except Exception as cleanup_error:
                  data = json.loads(receipt.read_text())
                  data["partialCleanupError"] = str(cleanup_error)
                  persist()
              raise
          for key, clone in data["ownedUIClones"].items():
              print(f"{key}={clone['udid']}")
          '''
          (Path(os.environ["RUNNER_TEMP"]) / "leg132-allocate-ui-simulators.py").write_text(allocation_source)
          for key, value in found.items():
              print(f"{key}={value}")
          PY

      - name: Build and run iOS unit tests on a simulator
        id: ios-tests
        if: steps.apple-source.outputs.available == 'true' && steps.project.outcome == 'success' && steps.simulators.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          PICTURESHOW_SPEC_DIR: ${{ github.workspace }}/spec
          IOS_SIMULATOR_ID: ${{ steps.simulators.outputs.ios_udid }}
        run: |
          set -o pipefail
          destination="platform=iOS Simulator,id=$IOS_SIMULATOR_ID"
          xcodebuild \
            -project apple/Pictureshow.xcodeproj \
            -scheme Pictureshow-iOS \
            -destination "$destination" \
            -derivedDataPath "$RUNNER_TEMP/PictureshowDerivedData" \
            -parallel-testing-enabled NO \
            build-for-testing CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee apple-test-results/ios-build.log
          echo "built=true" >> "$GITHUB_OUTPUT"
          xcodebuild \
            -project apple/Pictureshow.xcodeproj \
            -scheme Pictureshow-iOS \
            -destination "$destination" \
            -derivedDataPath "$RUNNER_TEMP/PictureshowDerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:Pictureshow-iOS-UnitTests \
            -resultBundlePath apple-test-results/ios-unit-tests.xcresult \
            test-without-building CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee apple-test-results/ios-unit-tests.log

      - name: Build and run tvOS unit tests on a simulator
        id: tvos-tests
        if: steps.apple-source.outputs.available == 'true' && steps.project.outcome == 'success' && steps.simulators.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          PICTURESHOW_SPEC_DIR: ${{ github.workspace }}/spec
          TVOS_SIMULATOR_ID: ${{ steps.simulators.outputs.tvos_udid }}
        run: |
          set -o pipefail
          destination="platform=tvOS Simulator,id=$TVOS_SIMULATOR_ID"
          xcodebuild \
            -project apple/Pictureshow.xcodeproj \
            -scheme Pictureshow-tvOS \
            -destination "$destination" \
            -derivedDataPath "$RUNNER_TEMP/PictureshowDerivedData" \
            -parallel-testing-enabled NO \
            build-for-testing CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee apple-test-results/tvos-build.log
          echo "built=true" >> "$GITHUB_OUTPUT"
          xcodebuild \
            -project apple/Pictureshow.xcodeproj \
            -scheme Pictureshow-tvOS \
            -destination "$destination" \
            -derivedDataPath "$RUNNER_TEMP/PictureshowDerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:Pictureshow-tvOS-UnitTests \
            -resultBundlePath apple-test-results/tvos-unit-tests.xcresult \
            test-without-building CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee apple-test-results/tvos-unit-tests.log

      - name: Repeat cold paused subtitle delivery for native UI review
        id: cold-subtitle-repeat
        if: startsWith(github.ref, 'refs/heads/ci/132') && steps.ios-tests.outputs.built == 'true'
        continue-on-error: true
        shell: bash
        env:
          PICTURESHOW_SPEC_DIR: ${{ github.workspace }}/spec
          IOS_SIMULATOR_ID: ${{ steps.simulators.outputs.ios_udid }}
        run: |
          set -o pipefail
          xcodebuild \
            -project apple/Pictureshow.xcodeproj \
            -scheme Pictureshow-iOS \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/PictureshowDerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:Pictureshow-iOS-UnitTests/ExternalSubtitleTests/testColdSelectedCuesPublishWhilePausedWithoutClockMovementOrResume \
            -test-iterations 10 -run-tests-until-failure \
            -test-repetition-relaunch-enabled YES \
            -resultBundlePath apple-test-results/ios-cold-subtitle-repeat.xcresult \
            test-without-building CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee apple-test-results/ios-cold-subtitle-repeat.log

      # Simulator products are temporary review evidence for this native UI leg.
      # Package only fresh CI output; local pilot configuration never enters CI.
      - name: Package simulator products for native UI review
        id: simulator-products
        if: always() && startsWith(github.ref, 'refs/heads/ci/132') && steps.apple-source.outputs.available == 'true'
        shell: bash
        run: |
          python3 - <<'PYPRODUCTS'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path
          products = Path(os.environ["RUNNER_TEMP"]) / "PictureshowDerivedData/Build/Products"
          if not products.is_dir():
              print("No simulator products were built.")
              raise SystemExit(0)
          destination = Path(os.environ["RUNNER_TEMP"]) / "apple-simulator-products"
          destination.mkdir()
          archive = destination / "simulator-products.zip"
          subprocess.run(["ditto", "-c", "-k", "--keepParent", str(products), str(archive)], check=True)
          def digest(path):
              result = hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      result.update(chunk)
              return result.hexdigest()
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          sources = sorted(set(workspace.glob("apple/**/*.swift")) | set(workspace.glob("apple/**/*.pbxproj")) | set(workspace.glob("spec/**/*.json")))
          manifest = {
              "head_sha": os.environ["GITHUB_SHA"],
              "architecture": platform.machine(),
              "xcode": subprocess.check_output(["xcodebuild", "-version"], text=True).strip(),
              "archive_sha256": digest(archive),
              "source_sha256": {str(path.relative_to(workspace)): digest(path) for path in sources if path.is_file()},
              "product_sha256": {str(path.relative_to(products)): digest(path) for path in sorted(products.rglob("*")) if path.is_file() and not path.is_symlink()},
          }
          (destination / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("available=true\n")
          PYPRODUCTS

      - uses: actions/upload-artifact@v7
        if: always() && steps.simulator-products.outputs.available == 'true'
        with:
          name: apple-simulator-products
          path: ${{ runner.temp }}/apple-simulator-products
          retention-days: 1
          if-no-files-found: error

      - name: Shut down completed unit simulators before reader bootstrap
        if: steps.simulators.outcome == 'success'
        run: python3 "$RUNNER_TEMP/leg132-ui-simulator-lifecycle.py" shutdown units

      - name: Clone separate UI sandboxes from the tested shutdown 27 pair
        id: ui-simulators
        if: steps.simulators.outcome == 'success' && steps.ios-tests.outcome == 'success' && steps.tvos-tests.outcome == 'success' && (!startsWith(github.ref, 'refs/heads/ci/132') || steps.cold-subtitle-repeat.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: python3 "$RUNNER_TEMP/leg132-allocate-ui-simulators.py" >> "$GITHUB_OUTPUT"

      - name: Verify actual VoiceOver speech and navigation on iOS
        id: ios-voiceover
        if: steps.apple-source.outputs.available == 'true' && steps.ios-tests.outputs.built == 'true' && steps.ui-simulators.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          VOICEOVER_SIMULATOR_ID: ${{ steps.ui-simulators.outputs.voiceover_ios_udid }}
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$VOICEOVER_SIMULATOR_ID" -b
          xcrun simctl terminate "$VOICEOVER_SIMULATOR_ID" app.pictureshow || true
          xcrun simctl uninstall "$VOICEOVER_SIMULATOR_ID" app.pictureshow
          xcodebuild \
            -project apple/Pictureshow.xcodeproj \
            -scheme Pictureshow-iOS \
            -destination "platform=iOS Simulator,id=$VOICEOVER_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/PictureshowDerivedData" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:Pictureshow-iOS-UITests/CatalogPresentationUITests/testNativeVoiceOverSpeechTraversal \
            -resultBundlePath apple-test-results/ios-voiceover-tests.xcresult \
            test-without-building CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee apple-test-results/ios-voiceover-tests.log
          xcrun xcresulttool get test-results summary --path apple-test-results/ios-voiceover-tests.xcresult --compact > apple-test-results/ios-voiceover-tests-summary.json
          python3 - <<'PYVOICEOVER'
          import json
          from pathlib import Path
          result = json.loads(Path("apple-test-results/ios-voiceover-tests-summary.json").read_text())
          if result.get("result") != "Passed" or result.get("totalTestCount") != 1 or result.get("passedTests") != 1 or result.get("failedTests") != 0 or result.get("skippedTests") != 0:
              raise SystemExit("Actual VoiceOver acceptance requires exactly one passed test and zero failures/skips: " + json.dumps(result))
          PYVOICEOVER

      - name: Shut down the owned iOS reader sandbox after its actual result
        if: always() && steps.ui-simulators.outcome == 'success'
        run: python3 "$RUNNER_TEMP/leg132-ui-simulator-lifecycle.py" shutdown voiceover_ios_udid

      - name: Verify actual VoiceOver speech and navigation on tvOS
        id: tvos-voiceover
        if: steps.apple-source.outputs.available == 'true' && steps.tvos-tests.outputs.built == 'true' && steps.ui-simulators.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          VOICEOVER_SIMULATOR_ID: ${{ steps.ui-simulators.outputs.voiceover_tvos_udid }}
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$VOICEOVER_SIMULATOR_ID" -b
          xcrun simctl terminate "$VOICEOVER_SIMULATOR_ID" app.pictureshow || true
          xcrun simctl uninstall "$VOICEOVER_SIMULATOR_ID" app.pictureshow
          xcodebuild \
            -project apple/Pictureshow.xcodeproj \
            -scheme Pictureshow-tvOS \
            -destination "platform=tvOS Simulator,id=$VOICEOVER_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/PictureshowDerivedData" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:Pictureshow-tvOS-UITests/CatalogPresentationUITests/testNativeVoiceOverSpeechTraversal \
            -resultBundlePath apple-test-results/tvos-voiceover-tests.xcresult \
            test-without-building CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee apple-test-results/tvos-voiceover-tests.log
          xcrun xcresulttool get test-results summary --path apple-test-results/tvos-voiceover-tests.xcresult --compact > apple-test-results/tvos-voiceover-tests-summary.json
          python3 - <<'PYVOICEOVER'
          import json
          from pathlib import Path
          result = json.loads(Path("apple-test-results/tvos-voiceover-tests-summary.json").read_text())
          if result.get("result") != "Passed" or result.get("totalTestCount") != 1 or result.get("passedTests") != 1 or result.get("failedTests") != 0 or result.get("skippedTests") != 0:
              raise SystemExit("Actual VoiceOver acceptance requires exactly one passed test and zero failures/skips: " + json.dumps(result))
          PYVOICEOVER

      - name: Shut down the owned TV reader sandbox after its actual result
        if: always() && steps.ui-simulators.outcome == 'success'
        run: python3 "$RUNNER_TEMP/leg132-ui-simulator-lifecycle.py" shutdown voiceover_tvos_udid

      - name: Verify native catalog layout and TV pixel contrast
        id: catalog-visual
        if: startsWith(github.ref, 'refs/heads/ci/132') && steps.ios-tests.outputs.built == 'true' && steps.tvos-tests.outputs.built == 'true' && steps.ui-simulators.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          IOS_SIMULATOR_ID: ${{ steps.ui-simulators.outputs.catalog_ios_udid }}
          TVOS_SIMULATOR_ID: ${{ steps.ui-simulators.outputs.catalog_tvos_udid }}
        run: |
          set -o pipefail
          for platform in iOS tvOS; do
            if [[ "$platform" == iOS ]]; then
              device="$IOS_SIMULATOR_ID"; cleanup_key="catalog_ios_udid"
            else
              device="$TVOS_SIMULATOR_ID"; cleanup_key="catalog_tvos_udid"
            fi
            xcrun simctl bootstatus "$device" -b
            xcrun simctl terminate "$device" app.pictureshow || true
            xcrun simctl uninstall "$device" app.pictureshow
            xcodebuild \
              -project apple/Pictureshow.xcodeproj \
              -scheme "Pictureshow-$platform" \
              -destination "platform=$platform Simulator,id=$device" \
              -derivedDataPath "$RUNNER_TEMP/PictureshowDerivedData" \
              -parallel-testing-enabled NO \
              -only-testing:"Pictureshow-$platform-UITests/CatalogPresentationUITests/testNativeCatalogSortPagingSeasonRetentionAndConversionPreference" \
              -resultBundlePath "apple-test-results/$platform-catalog-visual.xcresult" \
              test-without-building CODE_SIGNING_ALLOWED=NO \
              2>&1 | tee "apple-test-results/$platform-catalog-visual.log" || exit 1
            python3 "$RUNNER_TEMP/leg132-ui-simulator-lifecycle.py" shutdown "$cleanup_key"
          done

      - name: Dispose only the four owned UI sandboxes
        if: always() && steps.simulators.outcome == 'success'
        run: python3 "$RUNNER_TEMP/leg132-ui-simulator-lifecycle.py" dispose ui

      - name: Run Swift core tests and shared vectors
        id: core-package
        if: steps.apple-source.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        env:
          PICTURESHOW_SPEC_DIR: ${{ github.workspace }}/spec
        run: |
          set -o pipefail
          swift test --package-path apple/PictureshowCore 2>&1 | tee apple-test-results/core-package-tests.log

      - name: Run Swift transport tests
        id: transport-package
        if: steps.apple-source.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path apple/PictureshowTransport 2>&1 | tee apple-test-results/transport-package-tests.log

      - name: Collect Apple test counts
        if: always() && steps.apple-source.outputs.available == 'true'
        shell: bash
        run: |
          set +e
          for result in apple-test-results/*.xcresult; do
            [[ -d "$result" ]] || continue
            summary="${result%.xcresult}-summary.json"
            xcrun xcresulttool get test-results summary --path "$result" --compact > "$summary"
          done
          python3 - <<'PY'
          import glob
          import json
          import re
          from pathlib import Path

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          summaries = glob.glob("apple-test-results/*-summary.json")
          for filename in summaries:
              try:
                  result = json.loads(Path(filename).read_text())
              except (OSError, json.JSONDecodeError):
                  continue
              totals["tests"] += int(result.get("totalTestCount", 0))
              totals["failures"] += int(result.get("failedTests", 0))
              totals["skipped"] += int(result.get("skippedTests", 0))

          for filename in ("core-package-tests.log", "transport-package-tests.log"):
              path = Path("apple-test-results") / filename
              if not path.exists():
                  continue
              matches = re.findall(r"Executed\s+(\d+)\s+tests?,\s+with\s+(?:(\d+)\s+tests?\s+skipped\s+and\s+)?(\d+)\s+failures?", path.read_text(errors="replace"))
              if matches:
                  tests, skipped, failures = (int(value or 0) for value in matches[-1])
                  totals["tests"] += tests
                  totals["failures"] += failures
                  totals["skipped"] += skipped

          Path("apple-test-results/test-counts.json").write_text(json.dumps(totals, indent=2) + "\n")
          print(json.dumps(totals, sort_keys=True))
          PY

      - name: Explain missing Apple sources
        if: steps.apple-source.outputs.available != 'true'
        run: |
          mkdir -p apple-test-results
          echo '{"tests":0,"failures":0,"errors":0,"skipped":0}' > apple-test-results/test-counts.json
          echo "Apple sources are not present on this branch; 0 tests ran."

      - name: Enforce Apple test results
        if: always() && steps.apple-source.outputs.available == 'true'
        env:
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
          SIMULATORS_OUTCOME: ${{ steps.simulators.outcome }}
          UI_SANDBOXES_OUTCOME: ${{ steps.ui-simulators.outcome }}
          IOS_OUTCOME: ${{ steps.ios-tests.outcome }}
          TVOS_OUTCOME: ${{ steps.tvos-tests.outcome }}
          IOS_VOICEOVER_OUTCOME: ${{ steps.ios-voiceover.outcome }}
          TVOS_VOICEOVER_OUTCOME: ${{ steps.tvos-voiceover.outcome }}
          CORE_PACKAGE_OUTCOME: ${{ steps.core-package.outcome }}
          TRANSPORT_PACKAGE_OUTCOME: ${{ steps.transport-package.outcome }}
          COLD_REPEAT_REQUIRED: ${{ startsWith(github.ref, 'refs/heads/ci/132') }}
          COLD_REPEAT_OUTCOME: ${{ steps.cold-subtitle-repeat.outcome }}
          CATALOG_VISUAL_OUTCOME: ${{ steps.catalog-visual.outcome }}
        run: |
          if [[ "$COLD_REPEAT_REQUIRED" == true && "$COLD_REPEAT_OUTCOME" != success ]]; then
            echo "Cold subtitle repetition did not succeed: $COLD_REPEAT_OUTCOME"
            exit 1
          fi
          if [[ "$COLD_REPEAT_REQUIRED" == true && "$CATALOG_VISUAL_OUTCOME" != success ]]; then
            echo "Native catalog visual regressions did not succeed: $CATALOG_VISUAL_OUTCOME"
            exit 1
          fi
          for outcome in "$PROJECT_OUTCOME" "$SIMULATORS_OUTCOME" "$UI_SANDBOXES_OUTCOME" "$IOS_OUTCOME" "$TVOS_OUTCOME" "$IOS_VOICEOVER_OUTCOME" "$TVOS_VOICEOVER_OUTCOME" "$CORE_PACKAGE_OUTCOME" "$TRANSPORT_PACKAGE_OUTCOME"; do
            if [[ "$outcome" != success ]]; then
              echo "Apple CI step did not succeed: $outcome"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apple-test-results
          path: apple-test-results
          retention-days: 5
          if-no-files-found: ignore
