name: Web CI

on:
  workflow_dispatch:
  push:
    paths:
      - web/**
      - spec/**
      - .github/workflows/ci-web.yml
  pull_request:
    paths:
      - web/**
      - spec/**
      - .github/workflows/ci-web.yml

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: web-source
        name: Check whether the web app exists on this branch
        working-directory: .
        run: |
          if [[ -f web/package.json ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Web sources are not present on this branch; skipping web checks."
          fi

      - name: Set up Node.js
        id: node
        if: steps.web-source.outputs.available == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install dependencies
        id: npm-deps
        if: steps.web-source.outputs.available == 'true'
        run: npm ci

      - name: Prepare reports
        if: steps.web-source.outputs.available == 'true'
        run: mkdir -p artifacts

      - name: Install Playwright system dependencies
        if: steps.web-source.outputs.available == 'true'
        timeout-minutes: 20
        run: |
          # Let apt resume slow downloads and retry failed requests without restarting the package transaction.
          sudo tee /etc/apt/apt.conf.d/90-pictureshow-ci > /dev/null <<'APT'
          DPkg::Lock::Timeout "120";
          Acquire::Retries "3";
          Acquire::http::Timeout "60";
          Acquire::https::Timeout "60";
          APT
          npx --no-install playwright install-deps chromium webkit

      - name: Ensure ffmpeg is available for generated media fixtures
        if: steps.web-source.outputs.available == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Install Playwright browsers
        id: browsers
        if: steps.web-source.outputs.available == 'true'
        timeout-minutes: 10
        run: |
          npx --no-install playwright install chromium webkit

      - name: Unit tests
        if: always() && steps.web-source.outputs.available == 'true' && steps.npm-deps.outcome == 'success'
        run: npm test -- --reporter=junit --outputFile=artifacts/unit.xml

      - name: Shared spec vectors
        if: always() && steps.web-source.outputs.available == 'true' && steps.npm-deps.outcome == 'success'
        run: npm run test:vectors -- --reporter=junit --outputFile=artifacts/vectors.xml

      - name: Production build
        if: always() && steps.web-source.outputs.available == 'true' && steps.npm-deps.outcome == 'success'
        run: npm run build

      - name: Chromium and WebKit browser tests
        if: always() && steps.web-source.outputs.available == 'true' && steps.npm-deps.outcome == 'success' && steps.browsers.outcome == 'success'
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/web/artifacts/browser-tests.xml
        run: >-
          npm run test:e2e --
          --project=chromium
          --project=webkit
          --reporter=junit

      - name: Report runtime dependency audit
        if: always() && steps.web-source.outputs.available == 'true' && steps.npm-deps.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          npm audit --omit=dev > artifacts/npm-audit.txt 2>&1
          status=$?
          cat artifacts/npm-audit.txt
          echo "npm audit --omit=dev exit status: $status (report only)" | tee artifacts/npm-audit-status.txt
          exit 0

      - name: Explain missing web sources
        if: steps.web-source.outputs.available != 'true'
        working-directory: .
        run: |
          mkdir -p web/artifacts
          echo '{"tests":0,"failures":0,"errors":0,"skipped":0}' > web/artifacts/test-counts.json
          echo "Web sources are not present on this branch; 0 tests ran." > web/artifacts/skip.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: web-test-results
          path: |
            web/artifacts
            web/test-results
          retention-days: 5
          if-no-files-found: ignore
