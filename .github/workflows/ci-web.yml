name: Web CI

on:
  push:
    paths:
      - web/**
      - spec/**
      - .github/workflows/ci-web.yml
  pull_request:
    paths:
      - web/**
      - spec/**
      - .github/workflows/ci-web.yml

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - id: web-source
        name: Check whether the web app exists on this branch
        working-directory: .
        run: |
          if [[ -f web/package.json ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Web sources are not present on this branch; skipping web checks."
          fi

      - name: Set up Node.js
        id: node
        if: steps.web-source.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        id: npm-deps
        if: steps.web-source.outputs.available == 'true'
        run: npm ci

      - name: Ensure ffmpeg is available for generated media fixtures
        if: steps.web-source.outputs.available == 'true' && steps.npm-deps.outcome == 'success'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Prepare reports and install Playwright browsers
        id: browsers
        if: steps.web-source.outputs.available == 'true'
        run: |
          mkdir -p artifacts
          npx playwright install --with-deps chromium webkit

      - name: Unit tests
        if: always() && steps.web-source.outputs.available == 'true' && steps.npm-deps.outcome == 'success'
        run: npm test -- --reporter=junit --outputFile=artifacts/unit.xml

      - name: Shared spec vectors
        if: always() && steps.web-source.outputs.available == 'true' && steps.npm-deps.outcome == 'success'
        run: npm run test:vectors -- --reporter=junit --outputFile=artifacts/vectors.xml

      - name: Production build
        if: always() && steps.web-source.outputs.available == 'true' && steps.npm-deps.outcome == 'success'
        run: npm run build

      - name: Chromium and WebKit browser tests
        if: always() && steps.web-source.outputs.available == 'true' && steps.npm-deps.outcome == 'success' && steps.browsers.outcome == 'success'
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/web/artifacts/browser-tests.xml
        run: >-
          npm run test:e2e --
          --project=chromium
          --project=webkit
          --reporter=junit

      - name: Report runtime dependency audit
        if: always() && steps.web-source.outputs.available == 'true' && steps.npm-deps.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          npm audit --omit=dev > artifacts/npm-audit.txt 2>&1
          status=$?
          cat artifacts/npm-audit.txt
          echo "npm audit --omit=dev exit status: $status (report only)" | tee artifacts/npm-audit-status.txt
          exit 0

      - name: Explain missing web sources
        if: steps.web-source.outputs.available != 'true'
        working-directory: .
        run: |
          mkdir -p web/artifacts
          echo '{"tests":0,"failures":0,"errors":0,"skipped":0}' > web/artifacts/test-counts.json
          echo "Web sources are not present on this branch; 0 tests ran." > web/artifacts/skip.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-test-results
          path: |
            web/artifacts
            web/test-results
          retention-days: 5
          if-no-files-found: ignore
